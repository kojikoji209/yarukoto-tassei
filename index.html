<!DOCTYPE html>
<html lang="ja">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<h1>やる事リスト達成システム</h1>
<h2 id="clock">10</h2>
<button onclick="start()">スタート</button>
<script>
let timer;
function start(){
  clearInterval(timer);
  let n=10;
  document.getElementById("clock").textContent=n;
  timer=setInterval(()=>{
    n--;
    document.getElementById("clock").textContent=n;
    if(n===0)clearInterval(timer);
  },1000);
}
</script>
</body>
</html>
